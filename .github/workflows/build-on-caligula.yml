name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: download dependencies
      run: ./contrib/download_prerequisites
    - name: build outside source directory
      run: mkdir ../build-gcc && cd ../build-gcc
    - name: configure
      run: ../gcc/configure --disable-multilib --enable-languages=c,c++
    - name: make
      run: make -j28
    - name: make check
      run: make check -j28
    - name: make distcheck
      run: make distcheck -j28
